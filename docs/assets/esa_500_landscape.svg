<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ESA 500-card source-boundary atlas</title>
  <desc id="desc">Five batches cover 25 ESA missions with 500 evidence cards: 490 passed and 10 recorded insufficient source coverage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2b"/>
      <stop offset="0.58" stop-color="#0c3140"/>
      <stop offset="1" stop-color="#144f55"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="8%" r="72%">
      <stop offset="0" stop-color="#f2cc67" stop-opacity=".26"/>
      <stop offset="1" stop-color="#f2cc67" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #f8faf5; font: 700 34px Georgia, serif; letter-spacing: .5px; }
      .sub { fill: #a9c9c8; font: 500 15px 'Trebuchet MS', sans-serif; letter-spacing: 1.4px; }
      .metric { fill: #f8faf5; font: 700 46px Georgia, serif; }
      .metric-label { fill: #b9d2cf; font: 600 13px 'Trebuchet MS', sans-serif; letter-spacing: .7px; }
      .batch { fill: #0d2836; stroke: #41616a; stroke-width: 1; }
      .eyebrow { fill: #f2cc67; font: 700 12px 'Trebuchet MS', sans-serif; letter-spacing: 1.2px; }
      .batch-total { fill: #f8faf5; font: 700 24px Georgia, serif; }
      .mission { fill: #c8dcda; font: 500 13px 'Trebuchet MS', sans-serif; }
      .status { fill: #8fb3b2; font: 600 11px 'Trebuchet MS', sans-serif; }
      .track { fill: #a96d2c; }
      .pass { fill: #38a67a; }
      .finding { fill: #e3eeee; font: 600 14px 'Trebuchet MS', sans-serif; }
      .finding-label { fill: #f2cc67; font: 700 12px 'Trebuchet MS', sans-serif; letter-spacing: 1.1px; }
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="24" fill="url(#glow)"/>
  <path d="M0 148 H1200" stroke="#41616a" stroke-opacity=".55"/>
  <text x="52" y="55" class="sub">CLAIMBOUND / OFFICIAL ESA SOURCES / 2026-07-10 TO 2026-07-13</text>
  <text x="52" y="99" class="title">ESA source-boundary atlas</text>
  <text x="665" y="91" class="metric">500</text>
  <text x="665" y="119" class="metric-label">CARDS</text>
  <text x="810" y="91" class="metric">25</text>
  <text x="810" y="119" class="metric-label">MISSIONS</text>
  <text x="940" y="91" class="metric">98%</text>
  <text x="940" y="119" class="metric-label">SOURCE GATES PASSED</text>
  <g>
    <rect x="52" y="188" width="196" height="232" rx="18" class="batch"/>
    <text x="70" y="220" class="eyebrow">ISSUE #131</text>
    <text x="70" y="256" class="batch-total">100 gates</text>
    <text x="70" y="286" class="mission">Sentinel-1</text><text x="70" y="309" class="mission">Sentinel-2</text><text x="70" y="332" class="mission">Sentinel-3</text><text x="70" y="355" class="mission">Sentinel-4</text><text x="70" y="378" class="mission">Sentinel-5P</text>
    <rect x="70" y="389" width="160" height="8" rx="4" class="track"/>
    <rect x="70" y="389" width="160.0" height="8" rx="4" class="pass"/>
    <text x="70" y="414" class="status">100 pass / 0 limited</text>
  </g>
  <g>
    <rect x="272" y="188" width="196" height="232" rx="18" class="batch"/>
    <text x="290" y="220" class="eyebrow">ISSUE #132</text>
    <text x="290" y="256" class="batch-total">100 gates</text>
    <text x="290" y="286" class="mission">Sentinel-6</text><text x="290" y="309" class="mission">EarthCARE</text><text x="290" y="332" class="mission">Biomass</text><text x="290" y="355" class="mission">FLEX</text><text x="290" y="378" class="mission">Swarm</text>
    <rect x="290" y="389" width="160" height="8" rx="4" class="track"/>
    <rect x="290" y="389" width="160.0" height="8" rx="4" class="pass"/>
    <text x="290" y="414" class="status">100 pass / 0 limited</text>
  </g>
  <g>
    <rect x="492" y="188" width="196" height="232" rx="18" class="batch"/>
    <text x="510" y="220" class="eyebrow">ISSUE #133</text>
    <text x="510" y="256" class="batch-total">100 gates</text>
    <text x="510" y="286" class="mission">SMOS</text><text x="510" y="309" class="mission">Aeolus</text><text x="510" y="332" class="mission">CryoSat</text><text x="510" y="355" class="mission">Euclid</text><text x="510" y="378" class="mission">Gaia</text>
    <rect x="510" y="389" width="160" height="8" rx="4" class="track"/>
    <rect x="510" y="389" width="156.8" height="8" rx="4" class="pass"/>
    <text x="510" y="414" class="status">98 pass / 2 limited</text>
  </g>
  <g>
    <rect x="712" y="188" width="196" height="232" rx="18" class="batch"/>
    <text x="730" y="220" class="eyebrow">ISSUE #134</text>
    <text x="730" y="256" class="batch-total">100 gates</text>
    <text x="730" y="286" class="mission">Juice</text><text x="730" y="309" class="mission">BepiColombo</text><text x="730" y="332" class="mission">ExoMars</text><text x="730" y="355" class="mission">Mars Express</text><text x="730" y="378" class="mission">Cheops</text>
    <rect x="730" y="389" width="160" height="8" rx="4" class="track"/>
    <rect x="730" y="389" width="153.6" height="8" rx="4" class="pass"/>
    <text x="730" y="414" class="status">96 pass / 4 limited</text>
  </g>
  <g>
    <rect x="932" y="188" width="196" height="232" rx="18" class="batch"/>
    <text x="950" y="220" class="eyebrow">ISSUE #135</text>
    <text x="950" y="256" class="batch-total">100 gates</text>
    <text x="950" y="286" class="mission">Ariel</text><text x="950" y="309" class="mission">Plato</text><text x="950" y="332" class="mission">XMM-Newton</text><text x="950" y="355" class="mission">Rosetta</text><text x="950" y="378" class="mission">Cluster</text>
    <rect x="950" y="389" width="160" height="8" rx="4" class="track"/>
    <rect x="950" y="389" width="153.6" height="8" rx="4" class="pass"/>
    <text x="950" y="414" class="status">96 pass / 4 limited</text>
  </g>
  <rect x="52" y="452" width="1096" height="62" rx="15" fill="#09212e" stroke="#41616a"/>
  <text x="72" y="478" class="finding-label">THE HONEST FINDING</text>
  <text x="72" y="500" class="finding">10 gaps, all in launch-site or launch-vehicle fields omitted from five selected mission landing pages.</text>
  <circle cx="1086" cy="483" r="8" fill="#38a67a"/>
  <text x="1102" y="488" class="status">490 pass</text>
  <circle cx="1086" cy="504" r="8" fill="#d59039"/>
  <text x="1102" y="509" class="status">10 limited</text>
</svg>
