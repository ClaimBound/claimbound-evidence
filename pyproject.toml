[project]
name = "claimbound-evidence"
version = "0.4.7.4"
description = "ClaimBound public evidence-card toolkit for narrow public AI, ML and data claims"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pdfplumber>=0.11",
    "pypdf>=6.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.5",
]

[project.scripts]
claimbound = "claimbound_evidence.cli:main"


[project.urls]
Homepage = "https://github.com/ClaimBound/claimbound-evidence"
Repository = "https://github.com/ClaimBound/claimbound-evidence"
Issues = "https://github.com/ClaimBound/claimbound-evidence/issues"
Changelog = "https://github.com/ClaimBound/claimbound-evidence/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ClaimBound/claimbound-evidence/tree/main/docs"
"PyPI" = "https://pypi.org/project/claimbound-evidence/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimbound_evidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
