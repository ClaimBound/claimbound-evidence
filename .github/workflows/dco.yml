name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify DCO sign-off on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git log --format=%H "${BASE_SHA}..${HEAD_SHA}"); do
            body="$(git log -1 --format=%B "${sha}")"
            author="$(git log -1 --format='%an <%ae>' "${sha}")"
            if ! printf '%s\n' "${body}" | grep -Eq "^Signed-off-by: .+ <${author##*<}$"; then
              echo "::error::Commit ${sha} is missing a matching Signed-off-by trailer."
              echo "Author: ${author}"
              status=1
            fi
          done
          if [ "${status}" -ne 0 ]; then
            echo "Every PR commit must be signed off with 'git commit -s'. See DCO.md."
            exit 1
          fi
          echo "All PR commits have a matching DCO sign-off."
