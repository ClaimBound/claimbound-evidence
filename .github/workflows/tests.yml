name: tests

on:
  # A pull request is tested once (not again for its branch push); main and release tags are tested on push.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"  # weekly: the full matrix, including every macOS Python version

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pytest:
    # The first two job names are required status checks of the branch ruleset; keep them
    # exactly as they are. The others are informational.
    name: ${{ matrix.job }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: "pytest (ubuntu-latest, -n auto -q)"
            os: ubuntu-latest
            python: "3.12"
            pytest_args: "-n auto -q"
            cov_args: "--cov=protocolith --cov-report=term --cov-report=xml:coverage.xml"
          - job: "pytest-extra (ubuntu-latest, python 3.14)"
            os: ubuntu-latest
            python: "3.14"
            pytest_args: "-n auto -q"
          - job: "pytest (windows-latest, -q)"
            os: windows-latest
            python: "3.12"
            pytest_args: "-q"
          - job: "pytest-extra (macos-latest, python 3.12)"
            os: macos-latest
            python: "3.12"
            pytest_args: "-n auto -q"
          - job: "pytest-extra (ubuntu-latest, python 3.11)"
            os: ubuntu-latest
            python: "3.11"
            pytest_args: "-n auto -q"
          - job: "pytest-extra (ubuntu-latest, python 3.15)"
            os: ubuntu-latest
            python: "3.15"
            pytest_args: "-n auto -q"
          - job: "pytest-extra (windows-latest, python 3.11)"
            os: windows-latest
            python: "3.11"
            pytest_args: "-q"
          - job: "pytest-extra (windows-latest, python 3.15)"
            os: windows-latest
            python: "3.15"
            pytest_args: "-q"
          - job: "pytest-extra (ubuntu-latest, python 3.13)"
            os: ubuntu-latest
            python: "3.13"
            pytest_args: "-n auto -q"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - name: Lint
        if: matrix.cov_args
        run: uv run ruff check src tests
      - name: Type check the core (mypy strict)
        if: matrix.cov_args
        run: uv run mypy
      - run: uv run protocolith doctor
      - run: uv run protocolith validate-all
      - name: Run pytest
        id: pytest
        continue-on-error: true
        run: uv run --extra dev pytest ${{ matrix.pytest_args }} ${{ matrix.cov_args }} --junitxml=pytest-${{ runner.os }}-py${{ matrix.python }}.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pytest-${{ runner.os }}-py${{ matrix.python }}
          path: pytest-${{ runner.os }}-py${{ matrix.python }}.xml
          if-no-files-found: error
      - name: Upload coverage report
        if: always() && matrix.cov_args
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
      - name: Preserve pytest failure
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  pytest-macos-weekly:
    # The macOS runners are the scarce ones: a pull request runs one macOS Python version (pytest-extra, python 3.12 above)
    # and the core coverage job; the other macOS versions run here, in the weekly scheduled run or on demand.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: pytest-extra (macos-latest, python ${{ matrix.python }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - run: uv run protocolith doctor
      - run: uv run protocolith validate-all
      - run: uv run --extra dev pytest -n auto -q

  core-coverage:
    # The core is held at 100% line and branch coverage on every platform; the other platform's lock module is
    # excluded by its own pragma.
    name: core coverage (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --extra dev --python 3.13
      - name: Core tests with a 100% gate
        run: uv run pytest tests/core tests/core_hardening --cov=protocolith.core --cov-branch --cov-report=term-missing --cov-fail-under=100 -q
