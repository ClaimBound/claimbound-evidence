name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pytest:
    # The first two job names are required status checks of the branch ruleset; keep them
    # exactly as they are. The others are informational.
    name: ${{ matrix.job }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: "pytest (ubuntu-latest, -n auto -q)"
            os: ubuntu-latest
            python: "3.12"
            pytest_args: "-n auto -q"
            cov_args: "--cov=claimbound_evidence --cov-report=term --cov-report=xml:coverage.xml"
          - job: "pytest-extra (ubuntu-latest, python 3.14)"
            os: ubuntu-latest
            python: "3.14"
            pytest_args: "-n auto -q"
          - job: "pytest (windows-latest, -q)"
            os: windows-latest
            python: "3.12"
            pytest_args: "-q"
          - job: "pytest-extra (macos-latest, python 3.12)"
            os: macos-latest
            python: "3.12"
            pytest_args: "-n auto -q"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - name: Lint
        if: matrix.cov_args
        run: uv run ruff check src tests
      - run: uv run claimbound doctor
      - run: uv run claimbound validate-all
      - name: Run pytest
        id: pytest
        continue-on-error: true
        run: uv run --extra dev pytest ${{ matrix.pytest_args }} ${{ matrix.cov_args }} --junitxml=pytest-${{ runner.os }}-py${{ matrix.python }}.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ runner.os }}-py${{ matrix.python }}
          path: pytest-${{ runner.os }}-py${{ matrix.python }}.xml
          if-no-files-found: error
      - name: Upload coverage report
        if: always() && matrix.cov_args
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
      - name: Preserve pytest failure
        if: steps.pytest.outcome == 'failure'
        run: exit 1
