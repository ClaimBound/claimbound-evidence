name: docs

# Builds the documentation site on pull requests without deploying it.
on:
  pull_request:
    paths:
      - "docs_site/**"
      - "mkdocs.yml"
      - "scripts/build_docs_site.py"
      - "scripts/gen_cli_reference.py"
      - "src/claimbound_evidence/cli.py"
      - "docs/*.md"
      - "docs/assets/logo/**"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Command reference is up to date
        run: uv run python scripts/gen_cli_reference.py --check
      - name: Build site (strict)
        run: |
          uv run --extra docs python scripts/build_docs_site.py
          uv run --extra docs mkdocs build --strict
