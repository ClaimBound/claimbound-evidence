name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - ".gitattributes"
      - "docs/evidence_cards/CLAIMBOUND-CB7K-*.json"
      - "docs/public_claims/domains/**"
      - "artifacts/claim_batch_*_execution_manifest.json"
      - "artifacts/claim_batch_*_manual_review.json"
      - "artifacts/claim_batch_*_source_manifest.json"
      - "scripts/build_public_claim_catalog.py"
      - "scripts/audit_cb7k_campaign.py"
      - "scripts/build_verified_claim_atlas.py"
      - "scripts/build_public_claim_atlas_v2.py"
      - "scripts/public_claim_atlas/**"
      - "scripts/build_wikidata_public_claims.py"
      - "scripts/register_wikidata_public_claims.py"
      - "artifacts/cb7k_wikidata_public_claims.json"
      - "docs/atlas_home.html"
      - "docs_site/**"
      - "mkdocs.yml"
      - "scripts/build_docs_site.py"
      - "scripts/gen_cli_reference.py"
      - "docs/*.md"
      - "docs/assets/logo/**"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "docs/manifold_monte_neo_fair_race/**"
      - "docs/protocols/MANIFOLD_MONTE_NEO_FAIR_RACE_D001_PREREG_CHARTER.md"
      - "artifacts/manifold_monte_neo_fair_race_d001/**"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Assemble ESA, NASA, Leqembi, fair-race, and verified-claim atlas site
        run: |
          mkdir -p _site
          cp -R docs/esa/atlas _site/esa
          cp -R docs/nasa/atlas _site/nasa
          cp -R docs/leqembi _site/leqembi
          mkdir -p _site/manifold_monte_neo_fair_race
          cp docs/manifold_monte_neo_fair_race/index.html _site/manifold_monte_neo_fair_race/index.html
          python3 scripts/build_public_claim_atlas_v2.py --output _site/claims
          cp docs/atlas_home.html _site/index.html
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Build documentation site into _site/docs
        run: |
          uv run --extra docs python scripts/build_docs_site.py
          uv run --extra docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
