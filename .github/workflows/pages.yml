name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - ".gitattributes"
      - "docs/evidence_cards/CLAIMBOUND-CB7K-*.json"
      - "docs/public_claims/domains/**"
      - "artifacts/claim_batch_*_execution_manifest.json"
      - "artifacts/claim_batch_*_manual_review.json"
      - "artifacts/claim_batch_*_source_manifest.json"
      - "scripts/build_public_claim_catalog.py"
      - "scripts/audit_cb7k_campaign.py"
      - "scripts/build_verified_claim_atlas.py"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v6
      - name: Assemble ESA, NASA, Leqembi, and verified-claim atlas site
        run: |
          mkdir -p _site
          cp -R docs/esa/atlas _site/esa
          cp -R docs/nasa/atlas _site/nasa
          cp -R docs/leqembi _site/leqembi
          python3 scripts/build_verified_claim_atlas.py --output _site/claims
          cp docs/atlas_home.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
