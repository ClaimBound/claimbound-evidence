repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.(svg|json|jsonl|gif|png)$|^docs/evidence_cards/|^artifacts/'
      - id: trailing-whitespace
        exclude: '\.(svg|json|gif|png)$|^docs/evidence_cards/|^artifacts/|\.md$'
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        files: ^(src|tests)/
