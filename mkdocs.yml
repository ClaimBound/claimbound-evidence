site_name: Protocolith
site_description: Records, verifies and issues trial records.
site_url: https://protocolith.github.io/protocolith/docs/
repo_url: https://github.com/protocolith/protocolith
repo_name: Protocolith/protocolith
docs_dir: .docs_build
site_dir: _site/docs
copyright: Apache-2.0 licensed. A valid ledger shows internal consistency and ordering only.

theme:
  name: material
  logo: assets/protocolith-mark.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started-install.md
      - Your first record: getting-started-first-record.md
      - Local experiments: getting-started-local-experiments.md
      - Using it in CI: getting-started-ci.md
  - Concepts:
      - Protocol: concepts-protocol.md
      - Freeze: concepts-freeze.md
      - Ledger and hash chain: concepts-ledger.md
      - Result statuses: concepts-result-statuses.md
      - Canonical JSON: concepts-canonical-json.md
      - Cards: concepts-cards.md
  - Guides:
      - Local experiment workflow: guides-local-experiment-workflow.md
      - Headless and CI use: guides-headless-ci.md
      - Use it from an AI agent (MCP): guides-ai-agent-mcp.md
      - Query the ledger quickly: guides-query-the-ledger.md
      - MCP integration: guides-mcp.md
      - Python API: guides-python-api.md
      - Repair and crash recovery: guides-repair-and-crash-recovery.md
      - Anchoring the head: guides-anchoring-the-head.md
      - Anchor your results: guides-anchor-your-results.md
      - Browse experiments (atlas): guides-atlas.md
  - Reference:
      - Command reference: CLI.md
      - Core specification: spec-core.md
      - MCP tools and resources: reference-mcp.md
      - Python API reference: reference-python-api.md
      - Error codes: reference-error-codes.md
      - Conformance vectors: reference-conformance-vectors.md
      - File formats: reference-file-formats.md
      - Configuration: reference-configuration.md
  - Examples:
      - Overview: examples.md
